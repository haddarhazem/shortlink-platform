apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: shortlink
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: shortlink-api:0.1.0
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: shortlink-config
            - secretRef:
                name: shortlink-db